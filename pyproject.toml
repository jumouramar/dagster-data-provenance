[project]
name = "dagster-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "dagster-postgres",
    "numpy",
    "requests",
    "pydantic",
    "psycopg2-binary",
    "sqlalchemy",
]

[tool.setuptools.packages.find]
include = ["pipeline_random_calculator*", "pipeline_weather_rj*", "utils*"]
